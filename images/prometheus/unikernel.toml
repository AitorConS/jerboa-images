# Prometheus, the upstream release binary from Jerboa's first-party package
# index. The configuration is /etc/prometheus/prometheus.yml; the database is
# in /var/lib/prometheus, a volume to keep it.

[build]
lang = "raw"
pkg_source = "jerboa"
pkgs = ["prometheus:@VERSION@"]
dirs = ["/var/lib/prometheus"]
disk_size = "512M"

[program]
path = "prometheus"
args = [
  "--config.file=/etc/prometheus/prometheus.yml",
  "--storage.tsdb.path=/var/lib/prometheus",
  "--web.listen-address=:9090",
  "--web.enable-lifecycle",
]

[run]
memory = "512M"
