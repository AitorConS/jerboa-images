# SeaweedFS, the upstream release binary from Jerboa's first-party package
# index: master, volume server, filer and S3 gateway in one process.

[build]
lang = "raw"
pkg_source = "jerboa"
pkgs = ["seaweedfs:@VERSION@"]
dirs = ["/data", "/tmp"]
disk_size = "512M"

[program]
path = "seaweedfs"
args = ["server", "-dir=/data", "-ip=127.0.0.1", "-ip.bind=0.0.0.0", "-filer", "-s3", "-master.volumeSizeLimitMB=128", "-volume.max=8"]

[run]
memory = "512M"
