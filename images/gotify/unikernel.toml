# Gotify server, built from the upstream source in Jerboa's first-party
# package index, with its SQLite database in /app/data.

[build]
lang = "raw"
pkg_source = "jerboa"
pkgs = ["gotify:@PACKAGE_VERSION@"]
dirs = ["/app/data"]

[program]
path = "gotify"

[env]
GOTIFY_SERVER_PORT = "80"
GOTIFY_DATABASE_DIALECT = "sqlite3"
GOTIFY_DATABASE_CONNECTION = "/app/data/gotify.db"
GOTIFY_UPLOADEDIMAGESDIR = "/app/data/images"
GOTIFY_PLUGINSDIR = "/app/data/plugins"

[run]
memory = "128M"
