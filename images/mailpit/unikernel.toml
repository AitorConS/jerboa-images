# Mailpit, the upstream release binary from Jerboa's first-party package
# index. Messages are stored in /data/mailpit.db.

[build]
lang = "raw"
pkg_source = "jerboa"
pkgs = ["mailpit:@VERSION@"]
dirs = ["/data"]

[program]
path = "mailpit"
args = ["--database", "/data/mailpit.db", "--smtp", "0.0.0.0:1025", "--listen", "0.0.0.0:8025", "--disable-version-check"]

[run]
memory = "256M"
