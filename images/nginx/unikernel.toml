# nginx from Jerboa's first-party package index (built with prefix
# /etc/nginx). The configuration and the page it serves come from rootfs/:
# one process, in the foreground.

[build]
lang = "raw"
pkg_source = "jerboa"
pkgs = ["nginx:@VERSION@"]
dirs = ["/tmp"]

[program]
path = "nginx"
args = ["-p", "/etc/nginx", "-c", "/etc/nginx/conf/nginx.conf"]

[run]
memory = "256M"
