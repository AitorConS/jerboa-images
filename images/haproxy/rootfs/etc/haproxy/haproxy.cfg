# One process in the foreground: no "daemon" and no "master-worker" here, a
# unikernel cannot fork.
global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http
    bind :80
    http-request return status 200 content-type text/plain string "HAProxy on Jerboa\n" if { path / }
    # Add your backends: default_backend app

frontend stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 10s
    http-request use-service prometheus-exporter if { path /metrics }
