# Jaeger v2 all in one, built from the upstream source in Jerboa's first-party
# package index: OTLP in, traces kept in memory, the UI and query API out.

[build]
lang = "raw"
pkg_source = "jerboa"
pkgs = ["jaeger:@PACKAGE_VERSION@"]

[program]
path = "jaeger"
args = ["--config", "/etc/jaeger/config.yaml"]

[run]
memory = "512M"
