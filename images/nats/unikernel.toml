# nats-server, the upstream release binary from Jerboa's first-party package
# index, with JetStream storing streams in /data.

[build]
lang = "raw"
pkg_source = "jerboa"
pkgs = ["nats-server:@VERSION@"]
dirs = ["/data"]

[program]
path = "nats-server"
args = ["--jetstream", "--store_dir", "/data", "--http_port", "8222", "--name", "jerboa"]

[run]
memory = "512M"
