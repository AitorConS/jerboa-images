# memcached from Jerboa's first-party package index, built from source.

[build]
lang = "raw"
pkg_source = "jerboa"
pkgs = ["memcached:@VERSION@"]

[program]
path = "memcached"
# -u: memcached refuses to run as root without naming the user to run as;
# a unikernel has no other.
args = ["-u", "root", "-l", "0.0.0.0", "-p", "11211", "-U", "0", "-m", "128", "-c", "1024"]

[run]
memory = "256M"
