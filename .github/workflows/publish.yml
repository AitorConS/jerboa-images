name: Publish
# Builds every image under images/ for linux/amd64 and linux/arm64, boots
# the host's platform and checks that it answers, and on main publishes them
# to jerboa/<name> on registry.jerboa.dev. The registry trusts this workflow
# on main (a trusted publisher of the jerboa namespace): it pushes with the
# job's OIDC token, no stored credential, and every push is signed with
# Sigstore. Pull requests only build and test.
#
# The weekly run picks up new package and toolset builds; images whose disk
# did not change are not pushed again (scripts/publish.sh). Every run also
# scans the images' SBOMs for vulnerabilities; on main, critical or high ones
# open an issue and are sent to Telegram (scripts/scan.sh).
'on':
  push:
    branches:
    - main
  pull_request:
  schedule:
  - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      image:
        description: Image to build (a directory under images/), or all
        type: string
        default: all
      jerboa_ref:
        description: Branch, tag or commit of AitorConS/jerboa to build the CLI and daemon from
        type: string
        default: main
      publish:
        description: Publish (on main only)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # The release the runner installs first, for its daemon service, toolset
  # and hypervisor; the CLI and daemon are then replaced by builds of
  # JERBOA_REF, which have what this pipeline needs before it is released.
  JERBOA_RELEASE: 0.56.0
  JERBOA_REF: ${{ inputs.jerboa_ref || 'main' }}
  GRYPE_VERSION: 0.121.0
  GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
jobs:
  list:
    name: Images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: list
      env:
        IMAGE: ${{ inputs.image || 'all' }}
      run: |
        if [ "${IMAGE}" = all ]; then
          images="$(find images -mindepth 2 -maxdepth 2 -name image.env -printf '%h\n' | xargs -n1 basename | sort | jq -R . | jq -sc .)"
        else
          [ -f "images/${IMAGE}/image.env" ] || { echo "::error::no image ${IMAGE}"; exit 1; }
          images="$(jq -nc --arg i "${IMAGE}" '[$i]')"
        fi
        echo "images=${images}" >> "${GITHUB_OUTPUT}"
  image:
    name: ${{ matrix.image }}
    needs: list
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # Pushing as the registry's trusted publisher, and signing with Sigstore.
      id-token: write
      # Reporting vulnerabilities the scan finds.
      issues: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.list.outputs.images) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Let the runner use KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: AitorConS/jerboa/.github/actions/setup-jerboa@57cf12cb5577671a4a80e5275dab993dd76791ed
      with:
        version: ${{ env.JERBOA_RELEASE }}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: AitorConS/jerboa
        ref: ${{ env.JERBOA_REF }}
        persist-credentials: false
        path: jerboa-src
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: jerboa-src/go.mod
        cache-dependency-path: jerboa-src/go.sum
    - name: Replace the CLI and daemon with builds of ${{ env.JERBOA_REF }}
      working-directory: jerboa-src
      run: |
        commit="$(git rev-parse HEAD)"
        go build -trimpath -ldflags "-X main.version=${commit:0:12}" -o "${RUNNER_TEMP}/jerboa" ./cmd/jerboa
        go build -trimpath -ldflags "-X main.version=${commit:0:12}" -o "${RUNNER_TEMP}/jerboad" ./cmd/jerboad
        sudo install -m 0755 "${RUNNER_TEMP}/jerboa" "${RUNNER_TEMP}/jerboad" /usr/local/bin/
        sudo systemctl restart jerboad
        for _ in $(seq 1 30); do jerboa images >/dev/null 2>&1 && break; sleep 1; done
        jerboa version
        echo "Built AitorConS/jerboa ${commit}" >> "${GITHUB_STEP_SUMMARY}"
    - name: Build
      run: scripts/build.sh "${{ matrix.image }}"
    - name: Boot and check
      run: scripts/test.sh "${{ matrix.image }}"
    - name: Install grype
      run: |
        curl -fsSL -o "${RUNNER_TEMP}/grype.tar.gz" "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
        echo "${GRYPE_SHA256}  ${RUNNER_TEMP}/grype.tar.gz" | sha256sum -c -
        sudo tar -xzf "${RUNNER_TEMP}/grype.tar.gz" -C /usr/local/bin grype
        grype version
    - name: Scan for vulnerabilities
      id: scan
      # A scan that cannot run (its database unreachable) does not hold back
      # the images; the report step then has nothing to tell.
      continue-on-error: true
      run: scripts/scan.sh "${{ matrix.image }}"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: sbom-${{ matrix.image }}
        path: |
          sbom-*.cdx.json
          scan-*.json
        if-no-files-found: error
        retention-days: 30
    - name: Publish
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
      run: scripts/publish.sh "${{ matrix.image }}"
    - name: Report vulnerabilities
      # Once per image and version: an open issue means it was reported.
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.scan.outputs.found != '' && steps.scan.outputs.found != '0'
      env:
        GH_TOKEN: ${{ github.token }}
        IMAGE: ${{ matrix.image }}
        FOUND: ${{ steps.scan.outputs.found }}
        REPORT: ${{ steps.scan.outputs.report }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        . scripts/lib.sh
        load_image "${IMAGE}"
        title="Vulnerabilities in ${NAMESPACE}/${IMAGE} ${VERSION}"
        existing="$(gh issue list -R "${GITHUB_REPOSITORY}" --state open --search "\"${title}\" in:title" --json number,title -q ".[] | select(.title == \"${title}\") | .number" | head -n1)"
        if [ -n "${existing}" ]; then
          echo "already reported in #${existing}"
          exit 0
        fi
        printf '\nFound by %s\n' "${RUN_URL}" >> "${REPORT}"
        url="$(gh issue create -R "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${REPORT}")"
        text="⚠️ ${NAMESPACE}/${IMAGE} ${VERSION}: ${FOUND} critical or high vulnerabilities
        ${url}"
        if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
          echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set: ${text}"
          exit 0
        fi
        curl -fsS --retry 3 -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}"
