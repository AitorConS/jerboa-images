name: Publish
# Builds every image under images/ for linux/amd64 and linux/arm64, boots
# the host's platform and tests it (scripts/test.sh), and on main publishes them
# to jerboa/<name> on registry.jerboa.dev. The registry trusts this workflow
# on main (a trusted publisher of the jerboa namespace): it pushes with the
# job's OIDC token, no stored credential, and every push is signed with
# Sigstore. Pull requests only build and test.
#
# Each image is built and tested at every version its image.env lists, in a
# job of its own. The weekly run picks up new package and toolset builds;
# images whose disk did not change are not pushed again (scripts/publish.sh). Every run also
# scans the images' SBOMs for vulnerabilities; on main, critical or high ones
# open an issue and are sent to Telegram (scripts/scan.sh).
'on':
  push:
    branches:
    - main
  pull_request:
  schedule:
  - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      image:
        description: Image to build (a directory under images/), or all
        type: string
        default: all
      publish:
        description: Publish (on main only)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # The Jerboa release the images are built, signed and pushed with.
  JERBOA_RELEASE: 0.57.0
  GRYPE_VERSION: 0.121.0
  GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
jobs:
  list:
    name: Images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: list
      env:
        IMAGE: ${{ inputs.image || 'all' }}
      # One job per image and version: images/<name>/image.env lists VERSIONS.
      run: |
        if [ "${IMAGE}" = all ]; then
          names="$(find images -mindepth 2 -maxdepth 2 -name image.env -printf '%h\n' | xargs -n1 basename | sort)"
        else
          [ -f "images/${IMAGE}/image.env" ] || { echo "::error::no image ${IMAGE}"; exit 1; }
          names="${IMAGE}"
        fi
        images="$(for n in ${names}; do (. "images/${n}/image.env"; for v in ${VERSIONS}; do jq -nc --arg i "${n}" --arg v "${v}" '{image: $i, version: $v}'; done); done | jq -sc .)"
        echo "images=${images}" >> "${GITHUB_OUTPUT}"
  image:
    name: ${{ matrix.image }} ${{ matrix.version }}
    needs: list
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # Pushing as the registry's trusted publisher, and signing with Sigstore.
      id-token: write
      # Reporting vulnerabilities the scan finds.
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.images) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Let the runner use KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: AitorConS/jerboa/.github/actions/setup-jerboa@71f3739ec37278f10d36f5e19040ef3242befa84
      with:
        version: ${{ env.JERBOA_RELEASE }}
    - name: Wait for jerboad
      # The 0.57.0 installer returns before the daemon listens
      # (AitorConS/jerboa#224).
      run: |
        for _ in $(seq 30); do jerboa ps >/dev/null 2>&1 && exit 0; sleep 1; done
        jerboa ps
    - name: Build
      run: scripts/build.sh "${{ matrix.image }}" "${{ matrix.version }}"
    - name: Boot and check
      run: scripts/test.sh "${{ matrix.image }}" "${{ matrix.version }}"
    - name: Install grype
      run: |
        curl -fsSL -o "${RUNNER_TEMP}/grype.tar.gz" "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
        echo "${GRYPE_SHA256}  ${RUNNER_TEMP}/grype.tar.gz" | sha256sum -c -
        sudo tar -xzf "${RUNNER_TEMP}/grype.tar.gz" -C /usr/local/bin grype
        grype version
    - name: Scan for vulnerabilities
      id: scan
      # A scan that cannot run (its database unreachable) does not hold back
      # the images; the report step then has nothing to tell.
      continue-on-error: true
      run: scripts/scan.sh "${{ matrix.image }}" "${{ matrix.version }}"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: sbom-${{ matrix.image }}-${{ matrix.version }}
        path: |
          sbom-*.cdx.json
          scan-*.json
        if-no-files-found: error
        retention-days: 30
    - name: Publish
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
      run: scripts/publish.sh "${{ matrix.image }}" "${{ matrix.version }}"
    - name: Report vulnerabilities
      # Once per image and version: an open issue means it was reported.
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.scan.outputs.found != '' && steps.scan.outputs.found != '0'
      env:
        GH_TOKEN: ${{ github.token }}
        IMAGE: ${{ matrix.image }}
        IMAGE_VERSION: ${{ matrix.version }}
        FOUND: ${{ steps.scan.outputs.found }}
        REPORT: ${{ steps.scan.outputs.report }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        . scripts/lib.sh
        load_image "${IMAGE}" "${IMAGE_VERSION}"
        title="Vulnerabilities in ${NAMESPACE}/${IMAGE} ${VERSION}"
        existing="$(gh issue list -R "${GITHUB_REPOSITORY}" --state open --search "\"${title}\" in:title" --json number,title -q ".[] | select(.title == \"${title}\") | .number" | head -n1)"
        if [ -n "${existing}" ]; then
          echo "already reported in #${existing}"
          exit 0
        fi
        printf '\nFound by %s\n' "${RUN_URL}" >> "${REPORT}"
        url="$(gh issue create -R "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${REPORT}")"
        text="⚠️ ${NAMESPACE}/${IMAGE} ${VERSION}: ${FOUND} critical or high vulnerabilities
        ${url}"
        if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
          echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set: ${text}"
          exit 0
        fi
        curl -fsS --retry 3 -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}"
